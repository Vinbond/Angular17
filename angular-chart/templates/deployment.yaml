apiVersion: apps/v1
kind: Deployment
metadata:
  name: angular-deployment
spec:
  replicas: {{ .Values.replicaCount}}
  selector:
  matchLabels:
    app: angular-app
  template:
     metadata:
        labels:
          app: angular-app
     spec:
       containers:
          -name: angular-container
          image: {{ .Values.image.repository }} : {{ .values.image.tag}}
          imagePulPolicy: {{ .Values.image.pullPolicy}}
          ports:
            -containerPort: 80